[project]
name = "qwen-finetune"
version = "0.1.0"
description = "Finetune LLMs with Hugging Face Transformers"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0.0",
    "ipython>=9.4.0",
    "numpy>=2.3.1",
    "simple-parsing>=0.1.7",
    "torch==2.7.1",
    "peft>=0.10.0",
    "rocm[devel,libraries]",
    "tqdm>=4.67.1",
    "wandb>=0.18.0",
    "transformers>=4.45.0",
    "ipykernel>=7.0.1",
    "ipdb>=0.13.13",
    "pandas>=2.3.3",
    "ruff>=0.14.5",
]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]


[tool.uv.sources]
torch = { index = "therock" }
rocm = { index = "therock" } 

[[tool.uv.index]]
name = "therock"
url = "https://rocm.nightlies.amd.com/v2/gfx1151/" 


