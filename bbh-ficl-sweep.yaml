# WeightAndBiases sweep configuration template
#
# To run the sweep:
#   $ uv run wandb sweep --project ficl bbh-sweep.yaml
#   $ uv run wandb agent <sweep-id> <num-agents>

program: ficl-finetune.py
name: NEW Sports Understanding / Qwen3 4B

method: grid
metric:
  goal: maximize
  name: avg_accuracy
parameters:
  dataset:
    values:
    - navigate
    - geometric_shapes
    - snarks
    - temporal_sequences
    - object_counting
    # - sports_understanding
  random_seed:
    values: [1, 2, 3, 4, 5]
  instruction:
    values:
    - Reply directly with the answer. No thinking!
  learning_rate:
    values:
    - 3e-06
    - 1e-05
    - 3e-05
  model_name:
    values:
    - Qwen/Qwen3-4B
    # - Qwen/Qwen3-0.6B
    # - Qwen/Qwen3-1.7B
  num_context:
    values:
    - 0
    - 3
  num_epochs:
    values:
    - 1
    - 3
    - 5
    - 10
